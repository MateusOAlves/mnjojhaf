name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install masscan
        run: |
          sudo apt-get update
          sudo apt-get install -y masscan

      - name: chmod +x
        run: chmod +x *

      - name: Run masscan on port 8080
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          INPUT_FILE="ipv4.txt"
          OUTPUT_FILE="output_8080.txt"
          PORT="8080"
          
          if [ ! -f "$INPUT_FILE" ]; then
            echo "ERROR: $INPUT_FILE not found!"
            exit 1
          fi
          
          echo "Scanning port $PORT with masscan"
          # Convert ipv4.txt to masscan format (CIDR notation)
          # Masscan expects IP ranges in CIDR format or IP ranges
          # If your file has one IP per line, convert to CIDR /32
          while IFS= read -r ip; do
            echo "$ip/32" >> masscan_targets.txt
          done < "$INPUT_FILE"
          
          sudo masscan -p$PORT --rate=10009 -iL ipv4.txt -oG $OUTPUT_FILE
          
          # Masscan outputs in grepable format, convert to simple IP list
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            grep -oP '(?<=Host: )[\d.]+(?= \()' $OUTPUT_FILE > ip_list.txt
            FOUND_IPS=$(wc -l < ip_list.txt)
            
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✅ Port ${PORT}: ${FOUND_IPS} IPs found" \
              --max-time 30 || true
            
            if [ "$FOUND_IPS" -gt 0 ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F document=@ip_list.txt \
                -F caption="Port ${PORT} results (IPs only)" \
                --max-time 30 || true
            fi
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ No IPs found on port ${PORT}" \
              --max-time 30 || true
          fi
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: output_8080
          path: |
            output_8080.txt
            ip_list.txt
          if-no-files-found: ignore
