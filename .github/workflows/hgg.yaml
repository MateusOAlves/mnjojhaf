name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: 1
            port_start: 1000
            port_end: 1200
          - instance: 2
            port_start: 1201
            port_end: 1400
          - instance: 3
            port_start: 1401
            port_end: 1600
          - instance: 4
            port_start: 1601
            port_end: 1800
          - instance: 5
            port_start: 1801
            port_end: 2000
          - instance: 6
            port_start: 2001
            port_end: 2200
          - instance: 7
            port_start: 2201
            port_end: 2400
          - instance: 8
            port_start: 2401
            port_end: 2600
          - instance: 9
            port_start: 2601
            port_end: 2800
          - instance: 10
            port_start: 2801
            port_end: 3000
          - instance: 11
            port_start: 3001
            port_end: 3200
          - instance: 12
            port_start: 3201
            port_end: 3400
          - instance: 13
            port_start: 3401
            port_end: 3600
          - instance: 14
            port_start: 3601
            port_end: 3800
          - instance: 15
            port_start: 3801
            port_end: 4000
          - instance: 16
            port_start: 4001
            port_end: 4200
          - instance: 17
            port_start: 4201
            port_end: 4400
          - instance: 18
            port_start: 4401
            port_end: 4600
          - instance: 19
            port_start: 4601
            port_end: 4800
          - instance: 20
            port_start: 4801
            port_end: 5000

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt update
          sudo apt install -y masscan jq curl

      - name: Chuan bi file IP
        run: |
          cp ipv4.txt chunk.txt
          IP_COUNT=$(wc -l < chunk.txt)
          TOTAL_PORTS=$(( ${{ matrix.port_end }} - ${{ matrix.port_start }} + 1 ))
          
          echo "=========================================="
          echo "Instance ${{ matrix.instance }}"
          echo "  - IP count: $IP_COUNT (ALL IPs)"
          echo "  - Port range: ${{ matrix.port_start }} to ${{ matrix.port_end }}"
          echo "  - Total ports to scan: $TOTAL_PORTS"
          echo "=========================================="

      - name: Chay masscan tung port va gui ngay khi co ket qua
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          OUTPUT_FILE="output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt"
          > $OUTPUT_FILE
          
          TOTAL_PORTS=$(( ${{ matrix.port_end }} - ${{ matrix.port_start }} + 1 ))
          CURRENT_SCAN=0
          FOUND_IPS=0
          START_TIME=$(date +%s)
          MAX_RUNTIME=350
          
          send_result() {
            local PORT=$1
            local RESULT=$2
            local COUNT=$3
            local TOTAL=$4
            
            echo "$RESULT" | while read -r LINE; do
              if [ ! -z "$LINE" ]; then
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="${TELEGRAM_CHAT_ID}" \
                  -d text="🎯 Instance ${{ matrix.instance }} | Port $PORT | Found: $LINE" \
                  -d parse_mode="HTML"
              fi
            done
            
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="📊 Instance ${{ matrix.instance }} | Port $PORT done | Found $COUNT IPs | Total: $TOTAL IPs"
          }
          
          for PORT in $(seq ${{ matrix.port_start }} ${{ matrix.port_end }}); do
            CURRENT_TIME=$(date +%s)
            RUNTIME=$(( (CURRENT_TIME - START_TIME) / 60 ))
            
            if [ $RUNTIME -ge $MAX_RUNTIME ]; then
              echo ""
              echo "=========================================="
              echo "⚠️  TIME LIMIT REACHED! Stopping scan..."
              echo "Runtime: ${RUNTIME}m / 360m"
              echo "Ports scanned: $CURRENT_SCAN / $TOTAL_PORTS"
              echo "=========================================="
              break
            fi
            
            CURRENT_SCAN=$((CURRENT_SCAN + 1))
            PERCENT=$(( (CURRENT_SCAN * 100) / TOTAL_PORTS ))
            
            printf "\r[%d/%d] (%d%%) - Scanning port %d... (Runtime: %dm)" $CURRENT_SCAN $TOTAL_PORTS $PERCENT $PORT $RUNTIME
            
            RESULT=$(sudo masscan -iL chunk.txt -p$PORT --rate=10000 -oJ - 2>/dev/null | \
            sed '1d;$d;s/^[[:space:]]*,[[:space:]]*//' | \
            jq -r '.ip as $ip | .ports[] | "\($ip):\(.port)"' 2>/dev/null)
            
            if [ ! -z "$RESULT" ]; then
              echo "$RESULT" >> $OUTPUT_FILE
              FOUND_COUNT=$(echo "$RESULT" | wc -l)
              FOUND_IPS=$((FOUND_IPS + FOUND_COUNT))
              echo ""
              echo "  [+] Found $FOUND_COUNT IPs on port $PORT (Total: $FOUND_IPS)"
              send_result "$PORT" "$RESULT" "$FOUND_COUNT" "$FOUND_IPS"
            fi
            
            if [ $((CURRENT_SCAN % 20)) -eq 0 ]; then
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - START_TIME))
              if [ $CURRENT_SCAN -gt 0 ]; then
                AVG_TIME=$((ELAPSED / CURRENT_SCAN))
                REMAINING=$(( (TOTAL_PORTS - CURRENT_SCAN) * AVG_TIME ))
                REMAINING_MIN=$((REMAINING / 60))
                echo ""
                echo "  [STATS] Elapsed: ${ELAPSED}s | Avg: ${AVG_TIME}s/port | Remaining: ~${REMAINING_MIN}m | Found: $FOUND_IPS IPs"
              fi
            fi
          done
          
          END_TIME=$(date +%s)
          TOTAL_TIME=$((END_TIME - START_TIME))
          TOTAL_MIN=$((TOTAL_TIME / 60))
          
          echo ""
          echo "=========================================="
          echo "Instance ${{ matrix.instance }} COMPLETED!"
          echo "  - Total ports scanned: $CURRENT_SCAN / $TOTAL_PORTS"
          echo "  - Time: ${TOTAL_TIME}s (~${TOTAL_MIN}m)"
          echo "  - IPs found: $FOUND_IPS"
          echo "  - Output file: $OUTPUT_FILE"
          echo "=========================================="
          echo "So luong IP:port tim duoc: $(wc -l < $OUTPUT_FILE)"
      
      - name: Upload ket qua
        uses: actions/upload-artifact@v4
        with:
          name: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}
          path: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt
          if-no-files-found: ignore

  merge-and-send:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download tat ca ket qua
        uses: actions/download-artifact@v4
        with:
          pattern: output_*
          path: ./all_outputs/
          merge-multiple: true
      
      - name: Gop tat ca file va gui telegram
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          cd all_outputs
          
          echo "=========================================="
          echo "Merging all results..."
          echo "=========================================="
          
          cat output_*.txt 2>/dev/null | sort -u > final_result.txt
          FINAL_COUNT=$(wc -l < final_result.txt)
          echo "Final total IP:port: $FINAL_COUNT"
          cp final_result.txt ../final_result.txt
      
      - name: Gui ket qua cuoi cung len Telegram
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          COUNT=$(wc -l < final_result.txt)
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="🎯 SCAN COMPLETED! Total IP:port: ${COUNT}" \
            -d parse_mode="HTML"
          
          if [ $COUNT -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@final_result.txt \
              -F caption="FINAL RESULT: All ports 1000-5000 (20 instances)"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Khong tim thay IP:port nao"
          fi
      
      - name: Upload ket qua cuoi cung
        uses: actions/upload-artifact@v4
        with:
          name: final_result
          path: final_result.txt
