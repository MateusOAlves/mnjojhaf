name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: 1
            port_start: 1000
            port_end: 1888
          - instance: 2
            port_start: 1889
            port_end: 2777
          - instance: 3
            port_start: 2778
            port_end: 3666
          - instance: 4
            port_start: 3667
            port_end: 4555
          - instance: 5
            port_start: 4556
            port_end: 5444
          - instance: 6
            port_start: 5445
            port_end: 6333
          - instance: 7
            port_start: 6334
            port_end: 7222
          - instance: 8
            port_start: 7223
            port_end: 8111
          - instance: 9
            port_start: 8112
            port_end: 9000

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt update
          sudo apt install -y masscan jq curl

      - name: Chia file ipv4.txt cho instance
        run: |
          TOTAL=$(wc -l < ipv4.txt)
          LINES=$((TOTAL / 9))
          START=$(( (${{ matrix.instance }} - 1) * LINES + 1 ))
          END=$(( ${{ matrix.instance }} * LINES ))
          
          if [ ${{ matrix.instance }} -eq 9 ]; then
            END=$TOTAL
          fi
          
          sed -n "${START},${END}p" ipv4.txt > chunk.txt
          echo "Instance ${{ matrix.instance }}: $(wc -l < chunk.txt) IP - Ports: ${{ matrix.port_start }}-${{ matrix.port_end }}"

      - name: Chay masscan voi sudo
        continue-on-error: true
        run: |
          sudo masscan -iL chunk.txt -p${{ matrix.port_start }}-${{ matrix.port_end }} --rate=159000 -oJ - | \
          sed '1d;$d;s/^[[:space:]]*,[[:space:]]*//' | \
          jq -r '.ip as $ip | .ports[] | "\($ip):\(.port)"' 2>/dev/null > output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt
          
          echo "Instance ${{ matrix.instance }} da scan xong ports ${{ matrix.port_start }}-${{ matrix.port_end }}"
      
      - name: Upload ket qua
        uses: actions/upload-artifact@v4
        with:
          name: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}
          path: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt
          if-no-files-found: ignore

  merge-and-send:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download tat ca ket qua
        uses: actions/download-artifact@v4
        with:
          pattern: output_*
          path: ./all_outputs/
          merge-multiple: true
      
      - name: Merge tat ca ket qua
        run: |
          cd all_outputs
          cat *.txt 2>/dev/null > final_result.txt || echo "Khong co file output nao"
          COUNT=$(wc -l < final_result.txt)
          echo "Tong so IP:port: $COUNT"
          cp final_result.txt ../final_result.txt
      
      - name: Gui ket qua len Telegram
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          COUNT=$(wc -l < final_result.txt)
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Scan hoan tat! Tong so IP:port: ${COUNT}" \
            -d parse_mode="HTML"
          
          if [ $COUNT -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@final_result.txt \
              -F caption="Ket qua scan cac port tu 1000 den 9000"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Khong tim thay IP:port nao"
          fi
      
      - name: Upload ket qua cuoi cung
        uses: actions/upload-artifact@v4
        with:
          name: final_result
          path: final_result.txt
