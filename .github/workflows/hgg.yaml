name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: 1
            port: 8080
          - instance: 2
            port: 3128
          - instance: 3
            port: 80
          - instance: 4
            port: 1080
          - instance: 5
            port: 3129
          - instance: 6
            port: 8800
          - instance: 7
            port: 8000
          - instance: 8
            port: 8888
          - instance: 9
            port: 9999
          - instance: 10
            port: 443

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt update
          sudo apt install -y zmap jq curl tmate

      - name: Khoi dong tmate SSH
        if: always()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
          timeout-minutes: 60

      - name: Chia file ipv4.txt cho instance
        run: |
          TOTAL=$(wc -l < ipv4.txt)
          LINES=$((TOTAL / 10))
          START=$(( (${{ matrix.instance }} - 1) * LINES + 1 ))
          END=$(( ${{ matrix.instance }} * LINES ))
          
          if [ ${{ matrix.instance }} -eq 10 ]; then
            END=$TOTAL
          fi
          
          sed -n "${START},${END}p" ipv4.txt > chunk.txt
          echo "Instance ${{ matrix.instance }}: $(wc -l < chunk.txt) IP - Port: ${{ matrix.port }}"

      - name: Chay zmap voi sudo
        continue-on-error: true
        run: |
          sudo zmap -p "${{ matrix.port }}" -w chunk.txt -o - | awk '{print $1 ":" "${{ matrix.port }}"}' > "output_${{ matrix.instance }}_${{ matrix.port }}.txt"
          
          echo "Instance ${{ matrix.instance }} da scan xong port ${{ matrix.port }}"
          echo "So luong tim thay: $(wc -l < output_${{ matrix.instance }}_${{ matrix.port }}.txt)"
      
      - name: Upload ket qua
        uses: actions/upload-artifact@v4
        with:
          name: output_${{ matrix.instance }}_${{ matrix.port }}
          path: output_${{ matrix.instance }}_${{ matrix.port }}.txt
          if-no-files-found: ignore

  merge-and-send:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download tat ca ket qua
        uses: actions/download-artifact@v4
        with:
          pattern: output_*
          path: ./all_outputs/
          merge-multiple: true
      
      - name: Merge tat ca ket qua
        run: |
          cd all_outputs
          cat *.txt 2>/dev/null > final_result.txt || echo "Khong co file output nao"
          COUNT=$(wc -l < final_result.txt)
          echo "Tong so IP:port: $COUNT"
          cp final_result.txt ../final_result.txt
      
      - name: Gui ket qua len Telegram
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          COUNT=$(wc -l < final_result.txt)
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Scan hoan tat! Tong so IP:port: ${COUNT}" \
            -d parse_mode="HTML"
          
          if [ $COUNT -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@final_result.txt \
              -F caption="Ket qua scan cac port: 8080, 3128, 80, 1080, 3129, 8800, 8000, 8888, 9999, 443"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Khong tim thay IP:port nao"
          fi
      
      - name: Upload ket qua cuoi cung
        uses: actions/upload-artifact@v4
        with:
          name: final_result
          path: final_result.txt
