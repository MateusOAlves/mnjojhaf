name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: 1
            port_start: 1000
            port_end: 1800
          - instance: 2
            port_start: 1801
            port_end: 2600
          - instance: 3
            port_start: 2601
            port_end: 3400
          - instance: 4
            port_start: 3401
            port_end: 4200
          - instance: 5
            port_start: 4201
            port_end: 5000
          - instance: 6
            port_start: 5001
            port_end: 5800
          - instance: 7
            port_start: 5801
            port_end: 6600
          - instance: 8
            port_start: 6601
            port_end: 7400
          - instance: 9
            port_start: 7401
            port_end: 8200
          - instance: 10
            port_start: 8201
            port_end: 9000

    steps:
      - uses: actions/checkout@v4

      - name: Cai dat cong cu
        run: |
          sudo apt update
          sudo apt install -y masscan jq curl

      - name: Chia file ipv4.txt cho instance
        run: |
          TOTAL=$(wc -l < ipv4.txt)
          LINES=$((TOTAL / 10))
          START=$(( (${{ matrix.instance }} - 1) * LINES + 1 ))
          END=$(( ${{ matrix.instance }} * LINES ))
          
          if [ ${{ matrix.instance }} -eq 10 ]; then
            END=$TOTAL
          fi
          
          sed -n "${START},${END}p" ipv4.txt > chunk.txt
          echo "Instance ${{ matrix.instance }}: $(wc -l < chunk.txt) IP - Scan ports from ${{ matrix.port_start }} to ${{ matrix.port_end }}"

      - name: Chay masscan tung port mot
        continue-on-error: true
        run: |
          # Tao file output
          OUTPUT_FILE="output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt"
          > $OUTPUT_FILE
          
          # Vong lap quet tung port
          for PORT in $(seq ${{ matrix.port_start }} ${{ matrix.port_end }}); do
            echo "Scanning port $PORT..."
            sudo masscan -iL chunk.txt -p$PORT --rate=10000 -oJ - 2>/dev/null | \
            sed '1d;$d;s/^[[:space:]]*,[[:space:]]*//' | \
            jq -r '.ip as $ip | .ports[] | "\($ip):\(.port)"' 2>/dev/null >> $OUTPUT_FILE
            
            echo "Completed port $PORT"
          done
          
          echo "Instance ${{ matrix.instance }} da scan xong cac port tu ${{ matrix.port_start }} den ${{ matrix.port_end }}"
          echo "So luong IP:port tim duoc: $(wc -l < $OUTPUT_FILE)"
      
      - name: Upload ket qua
        uses: actions/upload-artifact@v4
        with:
          name: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}
          path: output_${{ matrix.instance }}_${{ matrix.port_start }}-${{ matrix.port_end }}.txt
          if-no-files-found: ignore

  merge-and-send:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download tat ca ket qua
        uses: actions/download-artifact@v4
        with:
          pattern: output_*
          path: ./all_outputs/
          merge-multiple: true
      
      - name: Merge tat ca ket qua
        run: |
          cd all_outputs
          cat *.txt 2>/dev/null > final_result.txt || echo "Khong co file output nao"
          COUNT=$(wc -l < final_result.txt)
          echo "Tong so IP:port: $COUNT"
          cp final_result.txt ../final_result.txt
      
      - name: Gui ket qua len Telegram
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          COUNT=$(wc -l < final_result.txt)
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="Scan hoan tat! Tong so IP:port: ${COUNT}" \
            -d parse_mode="HTML"
          
          if [ $COUNT -gt 0 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@final_result.txt \
              -F caption="Ket qua scan tung port tu 1000 den 9000"
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Khong tim thay IP:port nao"
          fi
      
      - name: Upload ket qua cuoi cung
        uses: actions/upload-artifact@v4
        with:
          name: final_result
          path: final_result.txt
