name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: chmod +x
        run: chmod +x *

      - name: Run zmap on port 8080
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: "8973833073:AAGstV_gHSEBQmo2ZiPZSguWlOcxFAPLeU4"
          TELEGRAM_CHAT_ID: "6320839835"
        run: |
          INPUT_FILE="ipv4.txt"
          OUTPUT_FILE="output_8080.txt"
          PORT="8080"
          
          if [ ! -f "$INPUT_FILE" ]; then
            echo "ERROR: $INPUT_FILE not found!"
            exit 1
          fi
          
          echo "Scanning port $PORT with ./zmap"
          ./zmap -p $PORT -w $INPUT_FILE -o $OUTPUT_FILE --rate=1000
          
          if [ -f "$OUTPUT_FILE" ] && [ -s "$OUTPUT_FILE" ]; then
            FOUND_IPS=$(wc -l < $OUTPUT_FILE)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✅ Port ${PORT}: ${FOUND_IPS} IPs found" \
              --max-time 30 || true
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@$OUTPUT_FILE \
              -F caption="Port ${PORT} results" \
              --max-time 30 || true
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="❌ No IPs found on port ${PORT}" \
              --max-time 30 || true
          fi
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: output_8080
          path: output_8080.txt
          if-no-files-found: ignore
